[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novacomp"
version = "0.1.0"
description = "NovaComp native agentic orchestration and continuity kernel"
authors = [{name = "suryamayaharum-droid"}]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104,<1",
  "pydantic>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.24,<1",
  "httpx>=0.25,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.isort]
profile = "black"
line_length = 88
